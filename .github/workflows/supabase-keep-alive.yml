name: Supabase keep alive

on:
  schedule:
    - cron: "0 6 * * *" # hver dag kl. 06 (UTC)
  workflow_dispatch: # gør det muligt at køre den manuelt

jobs:
  ping:
    # Henter variablerne fra samme environment som dit deploy-workflow
    environment: github-pages-deployment
    runs-on: ubuntu-latest
    env:
      # Tabel der findes i projektet (bruges også af appen)
      PING_TABLE: events
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_APIKEY: ${{ vars.VITE_SUPABASE_APIKEY }}
    steps:
      # Tilføjer /rest/v1, hvis VITE_SUPABASE_URL ikke allerede ender på det
      # Svaret og HTTP-statuskoden skrives i loggen
      - name: Ping Supabase
        run: |
          BASE="${SUPABASE_URL%/}"
          case "$BASE" in */rest/v1) ;; *) BASE="$BASE/rest/v1" ;; esac
          curl --fail-with-body -sS -w "\nHTTP %{http_code}\n" \
            "$BASE/${PING_TABLE}?select=id&limit=1" \
            -H "apikey: ${SUPABASE_APIKEY}"